<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MySample</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --text: #1f2328;
      --muted: #656d76;
      --accent: #2f6feb;
      --card: #ffffff;
      --border: #e3e3e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --text: #e6e6e6;
        --muted: #9aa1a9;
        --accent: #6ea8ff;
        --card: #171a21;
        --border: #2a2f39;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
    }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    p { margin: 0 0 16px; color: var(--muted); }
    a { color: var(--accent); }
    footer { margin-top: 32px; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>안녕하세요 👋</h1>
    <p>GitHub Pages로 만든 첫 번째 페이지입니다.</p>
    <p>이 파일(<code>index.html</code>)을 고쳐서 push하면 사이트가 바로 바뀌어요.</p>
    <footer>
      <a href="https://github.com/yul456/MySample">github.com/yul456/MySample</a>
    </footer>
  </main>
</body>
</html>
